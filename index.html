<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soukromá oblast — HEALLO®</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --eucalyptus: #2E6B6A;
    --eucalyptus-mid: #5A9E9B;
    --eucalyptus-bg: #EAF4F3;
    --terracotta: #D4612A;
    --cream: #FAF6F1;
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  html, body {
    font-family: 'Montserrat', sans-serif;
    color: var(--eucalyptus);
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
 
  body {
    background:
      radial-gradient(circle at top right, var(--eucalyptus-bg) 0%, var(--cream) 60%),
      var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
 
  .center {
    text-align: center;
    max-width: 480px;
  }
 
  /* Brand mark */
  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 64px;
  }
 
  .brand-mark-line {
    height: 1px;
    background: var(--eucalyptus-mid);
    width: 24px;
    opacity: 0.6;
  }
 
  .brand-mark-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--eucalyptus);
  }
 
  /* Ikona */
  .icon {
    font-size: 4rem;
    margin-bottom: 32px;
    animation: float 3s ease-in-out infinite;
    line-height: 1;
  }
 
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
 
  /* Hlavní věta */
  .message {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 4vw, 2rem);
    line-height: 1.4;
    color: var(--eucalyptus);
    letter-spacing: -0.005em;
  }
 
  .message em {
    font-style: italic;
    color: var(--terracotta);
    font-weight: 400;
  }
</style>
</head>
<body>
 
<div class="center">
 
  <div class="brand-mark">
    <div class="brand-mark-line"></div>
    <div class="brand-mark-text">HEALLO®</div>
    <div class="brand-mark-line"></div>
  </div>
 
  <div class="icon">🔐</div>
 
  <p class="message">Tahle stránka je <em>soukromá</em>.</p>
 
</div>
 
</body>
</html>
